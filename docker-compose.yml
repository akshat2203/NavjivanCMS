version: '3.8'

services:

  redis:
    image: redis:7-alpine
    container_name: redis_server
    restart: always
    command: redis-server --save "" --appendonly no

  web:
    build: .
    container_name: django_app
    command: gunicorn navjivan.wsgi:application --bind 0.0.0.0:8000 --workers=2 --threads=2
    env_file:
      - ./navjivan/.env
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - redis
    restart: always

  nginx:
    image: nginx:alpine
    container_name: nginx_server
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web

volumes:
  static_volume:
  media_volume:
